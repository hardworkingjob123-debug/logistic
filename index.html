<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>KERRY LOGISTICS x REITAR GLOBAL COMMAND CENTER</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;700&family=Inter:wght@400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #020508; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; display: flex; }
        h1 { margin: 0; font-family: 'Exo 2', sans-serif; font-size: 22px; font-weight: 700; color: #00f2ff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px #00f2ff; }
        #header { position: absolute; top: 0; width: calc(100% - 320px); z-index: 1000; background: linear-gradient(to bottom, rgba(0,20,40,0.95), transparent); padding: 25px; text-align: center; border-bottom: 1px solid rgba(0, 242, 255, 0.2); pointer-events: none; }
        .footprint-text { color: #66ccff; font-family: 'Roboto Mono'; font-size: 16px; font-weight: 700; margin-top: 10px; letter-spacing: 2px; text-shadow: 0 0 8px #66ccff; }

        #map { height: 100vh; flex-grow: 1; background: #020508; }
        #sidebar { width: 320px; height: 100vh; background: rgba(0, 8, 15, 0.98); border-left: 1px solid rgba(0, 242, 255, 0.5); z-index: 1001; display: flex; flex-direction: column; }
        .sidebar-title { padding: 20px; background: rgba(0, 242, 255, 0.1); color: #00f2ff; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; text-align: center; border-bottom: 2px solid #00f2ff; letter-spacing: 2px; }
        .network-list { overflow-y: auto; flex-grow: 1; padding: 12px; scroll-behavior: smooth; }
        
        .network-item { margin-bottom: 12px; border: 1px solid rgba(0, 242, 255, 0.15); background: rgba(0, 30, 60, 0.2); transition: 0.3s; }
        .item-header { padding: 15px; cursor: pointer; }
        .item-header b { font-family: 'Exo 2', sans-serif; font-size: 12px; color: #00f2ff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(0, 242, 255, 0.5); }
        
        /* 特定黃色高亮 */
        .network-item.reitar-yellow { border: 1px solid #f4d03f; background: rgba(244, 208, 63, 0.05); }
        .network-item.reitar-yellow .item-header b { color: #f4d03f; text-shadow: 0 0 10px #f4d03f; }

        .item-details { display: none; background: rgba(0,0,0,0.5); padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .address-list { list-style: none; padding: 0; margin: 0; font-family: 'Roboto Mono', monospace; font-size: 11px; text-transform: lowercase; }
        .address-list li { margin-bottom: 15px; color: #a0aec0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .address-list b { color: #ffffff; display: block; margin-bottom: 5px; font-size: 12px; text-transform: capitalize; font-family: 'Inter', sans-serif; }

        .ai-warehouse-img { width: 100%; height: 160px; object-fit: cover; border: 1px solid #f4d03f; margin: 10px 0; display: block; background: #111; }
        .ai-btn { display: block; width: 100%; padding: 12px 0; background: rgba(244, 208, 63, 0.2); border: 2px solid #f4d03f; color: #f4d03f; text-align: center; text-decoration: none; font-family: 'Exo 2'; font-weight: 700; font-size: 11px; text-transform: uppercase; margin-top: 10px; }
        .ai-btn:hover { background: #f4d03f; color: #000; box-shadow: 0 0 20px #f4d03f; }

        .leaflet-interactive { animation: hub-glow 2s infinite ease-in-out; }
        @keyframes hub-glow { 0% { stroke-width: 2; stroke-opacity: 1; } 50% { stroke-width: 15; stroke-opacity: 0.3; } 100% { stroke-width: 2; stroke-opacity: 1; } }

        .name-label { background: transparent !important; border: none !important; color: #00f2ff !important; font-family: 'Exo 2', sans-serif; font-size: 12px; font-weight: 700; text-shadow: 0 0 10px #00f2ff; text-transform: uppercase; pointer-events: auto !important; cursor: pointer; }
        .name-label.label-yellow { color: #f4d03f !important; text-shadow: 0 0 15px #f4d03f; }
    </style>
</head>
<body>

<div id="header">
    <h1>Global Strategic Network Monitoring</h1>
    <div class="footprint-text">STRATEGIC FOOTPRINT: 59 COUNTRIES & TERRITORIES</div>
</div>
<div id="map"></div>
<div id="sidebar">
    <div class="sidebar-title">REGIONAL DIRECTORY</div>
    <div class="network-list" id="networkList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { center: [20, 30], zoom: 3, zoomControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

    const LOGIN_URL = "http://218.255.24.130:37180/";

    // 數據補全：涵蓋 59 國的主要區域節點
    const networkData = [
        { id: "hk", name: "CHINA - HONG KONG SAR", lat: 22.36, lng: 114.12, isReitar: true, list: [
            { loc: "Kerry Reitar AI Auto-Warehouse", addr: "26 wing kei rd, kwai chung", isAI: true, img: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500" },
            { loc: "Kerry Cargo Centre (Global HQ)", addr: "55 wing kei rd, kwai chung" },
            { loc: "Kwai Chung Bonded Hub", addr: "ct7 container terminal" },
            { loc: "Chai Wan Logistics Centre", addr: "ka yip street, chai wan" },
            { loc: "Tsuen Wan Cold Store", addr: "wang wo tsai st, tsuen wan" },
            { loc: "Shatin Logistics Centre", addr: "shan mei street, fo tan" }
        ]},
        { id: "qatar", name: "MIDDLE EAST - QATAR", lat: 25.27, lng: 51.52, isReitar: true, list: [
            { loc: "Kerry Qatar Logistics City (QLC)", addr: "doha, qatar", isAI: true, img: "https://images.unsplash.com/photo-1590674000103-eb907406a666?w=500" },
            { loc: "Hamad Port Hub", addr: "doha container terminal" },
            { loc: "Doha Air Cargo Terminal", addr: "hamad international airport" }
        ]},
        { id: "mainland", name: "CHINA - MAINLAND (NORTH/SOUTH/CENTRAL)", lat: 31.23, lng: 121.47, isReitar: false, list: [
            { loc: "Shanghai Qingpu Hub", addr: "yuanheng road, shanghai" },
            { loc: "Shenzhen Qianhai Hub", addr: "bonded zone, shenzhen" },
            { loc: "Beijing Airport Hub", addr: "tianzhu airport zone, beijing" },
            { loc: "Guangzhou Free Trade Port", addr: "huangpu, guangzhou" },
            { loc: "Chengdu Central Hub", addr: "shuangliu district, chengdu" },
            { loc: "Wuhan Distribution Center", addr: "dongxihu district" }
        ]},
        { id: "sea", name: "SOUTH EAST ASIA (9 COUNTRIES)", lat: 13.75, lng: 100.50, isReitar: false, list: [
            { loc: "Thailand (KEX Bangna Hub)", addr: "bangna-trad road, bangkok" },
            { loc: "Singapore (Chin Bee Hub)", addr: "8 second chin bee rd" },
            { loc: "Vietnam (Binh Duong)", addr: "song than industrial park" },
            { loc: "Malaysia (Shah Alam)", addr: "selangor distribution center" },
            { loc: "Indonesia (Jakarta)", addr: "cikarang logistics park" },
            { loc: "Philippines (Manila)", addr: "parañaque city" }
        ]},
        { id: "europe", name: "EUROPEAN REGION (16 COUNTRIES)", lat: 50.11, lng: 8.68, isReitar: false, list: [
            { loc: "Germany Frankfurt Hub", addr: "cargocity south" },
            { loc: "UK Heathrow Gateway", addr: "feltham, middlesex" },
            { loc: "France CDG Hub", addr: "roissy-en-france" },
            { loc: "Netherlands Amsterdam", addr: "schiphol logistics park" },
            { loc: "Italy Milan Hub", addr: "segrate, milan" },
            { loc: "Spain Madrid Facility", addr: "coslada hub" }
        ]},
        { id: "americas", name: "AMERICAS (NORTH & LATAM - 5 COUNTRIES)", lat: 38.64, lng: -95.77, isReitar: false, list: [
            { loc: "USA West Coast Hub", addr: "torrance, california" },
            { loc: "Canada Toronto Hub", addr: "mississauga, ontario" },
            { loc: "Mexico City Gateway", addr: "tultitlán hub" },
            { loc: "Brazil Sao Paulo Node", addr: "guarulhos facility" }
        ]},
        { id: "cis", name: "CENTRAL ASIA & CIS (9 COUNTRIES)", lat: 48.01, lng: 66.92, isReitar: false, list: [
            { loc: "Kazakhstan Almaty Hub", addr: "central asian gateway" },
            { loc: "Uzbekistan Tashkent Node", addr: "tashkent industrial zone" }
        ]},
        { id: "oceania", name: "OCEANIA & PACIFIC (GLOBAL NODES)", lat: -25.27, lng: 133.77, isReitar: false, list: [
            { loc: "Australia Sydney Hub", addr: "matraville facility" },
            { loc: "New Zealand Auckland", addr: "mangere logistics park" }
        ]}
    ];

    networkData.forEach(function(d) {
        var dot = L.circleMarker([d.lat, d.lng], {
            radius: 7, 
            fillColor: d.isReitar ? '#f4d03f' : '#00f2ff',
            color: d.isReitar ? '#f4d03f' : '#00f2ff',
            weight: 2, fillOpacity: 0.9, interactive: true
        }).addTo(map);
        
        var tooltip = L.tooltip({
            permanent: true, direction: 'top', 
            className: 'name-label' + (d.isReitar ? ' label-yellow' : ''),
            offset: [0, -12], interactive: true
        }).setContent(d.name).setLatLng([d.lat, d.lng]).addTo(map);

        var warehouseHtml = d.list.map(w => `
            <li>
                <b>${w.loc}</b><span>${w.addr}</span>
                ${w.isAI ? `<img src="${w.img}" class="ai-warehouse-img" onerror="this.src='https://images.unsplash.com/photo-1553413077-190dd305871c?w=500'"><a href="${LOGIN_URL}" target="_blank" class="ai-btn">LOGIN TO DIGITAL SYSTEM</a>` : ''}
            </li>`).join('');

        var item = document.createElement('div');
        item.className = 'network-item' + (d.isReitar ? ' reitar-yellow' : '');
        item.innerHTML = `
            <div class="item-header"><b>> ${d.name}</b></div>
            <div class="item-details"><ul class="address-list">${warehouseHtml}</ul></div>
        `;
        
        const toggleUI = () => {
            var details = item.querySelector('.item-details');
            var isOpen = details.style.display === 'block';
            document.querySelectorAll('.item-details').forEach(el => el.style.display = 'none');
            if (!isOpen) {
                details.style.display = 'block';
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        };

        item.querySelector('.item-header').onclick = toggleUI;
        dot.on('click', toggleUI);
        tooltip.on('click', toggleUI);

        document.getElementById('networkList').appendChild(item);
    });
</script>
</body>
</html>
